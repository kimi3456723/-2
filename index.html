<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>彈幕躲避 V2.0 - 道具大升級</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #0a0a15; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas { display: block; }
#version { position: fixed; top: 8px; left: 8px; color: #00ff88; font-family: monospace; font-size: 14px; font-weight: bold; pointer-events: none; z-index: 10; }
</style>
</head>
<body>
<div id="version">V2.0 道具大升級</div>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ========== 遊戲狀態 ==========
const game = { state: 'playing', score: 0, time: 0, slowTime: 0 };

// ========== 玩家 ==========
const player = {
  x: canvas.width / 2,
  y: canvas.height / 2,
  radius: 18,
  hp: 100,
  maxHp: 100,
  speed: 4.5,
  shield: 0,
  invincible: 0,
  magnetTime: 0,
  speedTime: 0,
  droneTime: 0,
  droneAngle: 0
};

// ========== 輸入 ==========
const keys = {};
let touchId = null, touchStartX = 0, touchStartY = 0;

// ========== 實體 ==========
let bullets = [];
let items = [];
let particles = [];
let floatingTexts = [];
let laserBeams = [];

// ========== 背包 (20格) ==========
const backpack = {
  slots: new Array(20).fill(null)
};

// 新增多種道具定義
const ITEM_TYPES = {
  SHIELD: { name: '保護盾', color: '#00aaff', icon: '🛡️', maxStack: 3, autoUse: true },
  ERASER: { name: '消除器', color: '#ff6600', icon: '💥', maxStack: 5, autoUse: false },
  COMPUTER: { name: '電腦', color: '#00ff88', icon: '💻', maxStack: 3, autoUse: false },
  QUILT: { name: '棉被', color: '#ffccaa', icon: '🛏️', maxStack: 5, autoUse: false },
  MEDKIT: { name: '急救包', color: '#ff3366', icon: '💊', maxStack: 3, autoUse: false },
  CLOCK: { name: '時光時鐘', color: '#bb55ff', icon: '⏳', maxStack: 3, autoUse: false },
  BOMB: { name: '核能炸彈', color: '#ffcc00', icon: '💣', maxStack: 2, autoUse: false },
  BOOTS: { name: '加速靴', color: '#33ffff', icon: '👟', maxStack: 3, autoUse: false },
  MAGNET: { name: '強效磁鐵', color: '#ff00ee', icon: '🧲', maxStack: 3, autoUse: false },
  DRONE: { name: '浮游砲台', color: '#00ffaa', icon: '🤖', maxStack: 2, autoUse: false },
  EXP: { name: '經驗水晶', color: '#ffff55', icon: '💎', maxStack: 10, autoUse: false }
};

// ========== 音效 ==========
const sounds = {};
function loadSound(name, url) {
  const a = new Audio(url);
  a.volume = 0.35;
  sounds[name] = a;
}
loadSound('pickup', 'https://assets.mixkit.co/active_storage/sfx/2578/2578-preview.mp3');
loadSound('hit', 'https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3');
loadSound('shield', 'https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3');
loadSound('revive', 'https://assets.mixkit.co/active_storage/sfx/1434/1434-preview.mp3');
loadSound('eraser', 'https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
loadSound('boom', 'https://assets.mixkit.co/active_storage/sfx/2874/2874-preview.mp3');

function playSound(name) {
  if (sounds[name]) {
    sounds[name].currentTime = 0;
    sounds[name].play().catch(() => {});
  }
}

// ========== 鍵盤與點擊輸入 ==========
document.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ' || e.key.toLowerCase() === 'e') {
    e.preventDefault();
    useEraser();
  }
});
document.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

// 背包點擊使用道具
canvas.addEventListener('mousedown', e => {
  if (game.state === 'gameover') { restart(); return; }
  checkBackpackClick(e.clientX, e.clientY);
});

// ========== 觸控輸入 ==========
canvas.addEventListener('touchstart', e => {
  if (game.state === 'gameover') { restart(); return; }
  const touch = e.touches[0];
  if (!checkBackpackClick(touch.clientX, touch.clientY)) {
    touchId = touch.identifier;
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === touchId) {
      const dx = e.changedTouches[i].clientX - touchStartX;
      const dy = e.changedTouches[i].clientY - touchStartY;
      player.x += dx * 0.8;
      player.y += dy * 0.8;
      touchStartX = e.changedTouches[i].clientX;
      touchStartY = e.changedTouches[i].clientY;
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === touchId) touchId = null;
  }
});
canvas.addEventListener('touchcancel', e => { touchId = null; });

// 背包點擊邏輯
function checkBackpackClick(cx, cy) {
  const bpX = 12, bpY = canvas.height - 110;
  for (let i = 0; i < 20; i++) {
    const ix = bpX + (i % 5) * 32;
    const iy = bpY + 16 + Math.floor(i / 5) * 22;
    if (cx >= ix && cx <= ix + 28 && cy >= iy && cy <= iy + 18) {
      if (backpack.slots[i]) {
        useItemFromSlot(i);
        return true;
      }
    }
  }
  return false;
}

// ========== 背包工具函數 ==========
function addToBackpack(type) {
  for (let i = 0; i < backpack.slots.length; i++) {
    if (backpack.slots[i] === null) {
      backpack.slots[i] = { type: type, count: 1 };
      return true;
    } else if (backpack.slots[i].type === type && backpack.slots[i].count < ITEM_TYPES[type].maxStack) {
      backpack.slots[i].count++;
      return true;
    }
  }
  return false;
}

function countInBackpack(type) {
  let count = 0;
  for (let i = 0; i < backpack.slots.length; i++) {
    if (backpack.slots[i] && backpack.slots[i].type === type) count += backpack.slots[i].count;
  }
  return count;
}

function removeFromBackpack(type, count = 1) {
  for (let i = 0; i < backpack.slots.length && count > 0; i++) {
    if (backpack.slots[i] && backpack.slots[i].type === type) {
      const remove = Math.min(count, backpack.slots[i].count);
      backpack.slots[i].count -= remove;
      count -= remove;
      if (backpack.slots[i].count <= 0) backpack.slots[i] = null;
    }
  }
}

// 主動使用格子的道具
function useItemFromSlot(index) {
  const item = backpack.slots[index];
  if (!item) return;

  let used = true;
  switch (item.type) {
    case 'MEDKIT':
      player.hp = Math.min(player.maxHp, player.hp + 40);
      playSound('pickup');
      floatingTexts.push({ x: player.x, y: player.y - 40, text: '💊 HP +40', life: 50, color: '#ff3366' });
      break;
    case 'CLOCK':
      game.slowTime = 300; // 5秒減速
      playSound('eraser');
      floatingTexts.push({ x: player.x, y: player.y - 40, text: '⏳ 時空減速!', life: 50, color: '#bb55ff' });
      break;
    case 'BOMB':
      playSound('boom');
      createParticles(canvas.width / 2, canvas.height / 2, '#ffcc00', 50);
      floatingTexts.push({ x: canvas.width / 2, y: canvas.height / 2, text: '💣 全螢幕清空!', life: 60, color: '#ffcc00' });
      bullets = [];
      break;
    case 'BOOTS':
      player.speedTime = 300;
      playSound('pickup');
      floatingTexts.push({ x: player.x, y: player.y - 40, text: '👟 移動加速!', life: 50, color: '#33ffff' });
      break;
    case 'MAGNET':
      player.magnetTime = 360;
      playSound('pickup');
      floatingTexts.push({ x: player.x, y: player.y - 40, text: '🧲 磁鐵開啟!', life: 50, color: '#ff00ee' });
      break;
    case 'DRONE':
      player.droneTime = 450;
      playSound('shield');
      floatingTexts.push({ x: player.x, y: player.y - 40, text: '🤖 砲台支援!', life: 50, color: '#00ffaa' });
      break;
    case 'EXP':
      game.score += 500;
      playSound('pickup');
      floatingTexts.push({ x: player.x, y: player.y - 40, text: '💎 分數 +500!', life: 50, color: '#ffff55' });
      break;
    case 'ERASER':
      useEraser();
      used = false; // 讓 useEraser 處理扣除
      break;
    default:
      used = false;
      break;
  }

  if (used) {
    item.count--;
    if (item.count <= 0) backpack.slots[index] = null;
  }
}

// ========== 使用消除器 ==========
function useEraser() {
  if (countInBackpack('ERASER') > 0) {
    removeFromBackpack('ERASER', 1);
    playSound('eraser');
    const range = 200;
    let cleared = 0;
    for (let i = bullets.length - 1; i >= 0; i--) {
      const dx = bullets[i].x - player.x;
      const dy = bullets[i].y - player.y;
      if (Math.sqrt(dx * dx + dy * dy) < range) {
        createParticles(bullets[i].x, bullets[i].y, '#ffff00', 5);
        bullets.splice(i, 1);
        cleared++;
      }
    }
    floatingTexts.push({ x: player.x, y: player.y - 30, text: '💥 清除 ' + cleared + ' 發!', life: 60, color: '#ff6600' });
  }
}

// ========== 生成子彈與道具 ==========
function spawnBullet() {
  const side = Math.floor(Math.random() * 4);
  let x, y;
  const speed = (1.5 + game.time * 0.0005 + Math.random() * 1.5);
  const margin = 30;
  if (side === 0) { x = Math.random() * canvas.width; y = -margin; }
  else if (side === 1) { x = canvas.width + margin; y = Math.random() * canvas.height; }
  else if (side === 2) { x = Math.random() * canvas.width; y = canvas.height + margin; }
  else { x = -margin; y = Math.random() * canvas.height; }
  const angle = Math.atan2(player.y - y, player.x - x);
  bullets.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, radius: 5, color: '#ff0044' });
}

function spawnItem() {
  const keys = Object.keys(ITEM_TYPES);
  const type = keys[Math.floor(Math.random() * keys.length)];
  const x = 50 + Math.random() * (canvas.width - 100);
  const y = 50 + Math.random() * (canvas.height - 100);
  items.push({ x, y, type, radius: 14, life: 600 });
}

function createParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 4;
    particles.push({
      x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: 30 + Math.random() * 20, color, radius: 2 + Math.random() * 3
    });
  }
}

// ========== 受傷與復活 ==========
function takeDamage(amount) {
  if (player.invincible > 0) return;

  if (player.shield > 0) {
    player.shield--;
    playSound('shield');
    createParticles(player.x, player.y, '#00aaff', 10);
    floatingTexts.push({ x: player.x, y: player.y - 40, text: '護盾抵擋!', life: 45, color: '#00aaff' });
    return;
  }

  if (countInBackpack('QUILT') > 0) {
    removeFromBackpack('QUILT', 1);
    playSound('shield');
    createParticles(player.x, player.y, '#ffccaa', 8);
    floatingTexts.push({ x: player.x, y: player.y - 40, text: '🛏️棉被擋住了!', life: 45, color: '#ffccaa' });
    return;
  }

  player.hp -= amount;
  playSound('hit');
  createParticles(player.x, player.y, '#ff0044', 8);
  player.invincible = 30;

  if (player.hp <= 0) {
    player.hp = 0;
    handleDeath();
  }
}

function handleDeath() {
  if (countInBackpack('ERASER') > 0) {
    removeFromBackpack('ERASER', 1);
    revivePlayer('💥消除器復活!');
    return;
  }
  if (countInBackpack('COMPUTER') > 0) {
    removeFromBackpack('COMPUTER', 1);
    revivePlayer('💻電腦復活!');
    return;
  }
  game.state = 'gameover';
}

function revivePlayer(msg) {
  player.hp = player.maxHp;
  player.invincible = 120;
  playSound('revive');
  createParticles(player.x, player.y, '#00ff88', 20);
  floatingTexts.push({ x: player.x, y: player.y - 50, text: msg, life: 60, color: '#00ff88' });
  bullets = [];
}

// ========== 更新遊戲邏輯 ==========
function update() {
  if (game.state !== 'playing') return;

  game.time++;
  game.score = Math.floor(game.time / 10);

  // 時空減速倒數
  if (game.slowTime > 0) game.slowTime--;
  if (player.speedTime > 0) player.speedTime--;
  if (player.magnetTime > 0) player.magnetTime--;
  if (player.droneTime > 0) player.droneTime--;

  // 玩家移動速度计算
  const currentSpeed = player.speed * (player.speedTime > 0 ? 1.6 : 1.0);
  let mx = 0, my = 0;
  if (keys['w'] || keys['arrowup']) my -= 1;
  if (keys['s'] || keys['arrowdown']) my += 1;
  if (keys['a'] || keys['arrowleft']) mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;
  if (mx !== 0 || my !== 0) {
    const len = Math.sqrt(mx * mx + my * my);
    player.x += (mx / len) * currentSpeed;
    player.y += (my / len) * currentSpeed;
  }

  player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
  player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

  if (player.invincible > 0) player.invincible--;

  // 浮游砲台行為
  if (player.droneTime > 0) {
    player.droneAngle += 0.08;
    if (game.time % 12 === 0 && bullets.length > 0) {
      // 找到最近的子彈並消除
      let closestIdx = -1, minDist = 250;
      for (let i = 0; i < bullets.length; i++) {
        const d = Math.hypot(bullets[i].x - player.x, bullets[i].y - player.y);
        if (d < minDist) { minDist = d; closestIdx = i; }
      }
      if (closestIdx !== -1) {
        createParticles(bullets[closestIdx].x, bullets[closestIdx].y, '#00ffaa', 6);
        bullets.splice(closestIdx, 1);
      }
    }
  }

  // 子彈生成與更新
  const spawnRate = Math.max(5, 30 - Math.floor(game.time / 300));
  if (game.time % spawnRate === 0) spawnBullet();

  const bSpeedMult = game.slowTime > 0 ? 0.3 : 1.0;
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * bSpeedMult;
    b.y += b.vy * bSpeedMult;

    if (b.x < -50 || b.x > canvas.width + 50 || b.y < -50 || b.y > canvas.height + 50) {
      bullets.splice(i, 1); continue;
    }
    if (Math.hypot(b.x - player.x, b.y - player.y) < b.radius + player.radius) {
      takeDamage(10);
      bullets.splice(i, 1);
    }
  }

  // 生成與更新道具
  if (game.time % 350 === 0) spawnItem();

  for (let i = items.length - 1; i >= 0; i--) {
    const item = items[i];
    item.life--;
    if (item.life <= 0) { items.splice(i, 1); continue; }

    // 磁鐵吸附邏輯
    if (player.magnetTime > 0) {
      const angle = Math.atan2(player.y - item.y, player.x - item.x);
      item.x += Math.cos(angle) * 5;
      item.y += Math.sin(angle) * 5;
    }

    if (Math.hypot(item.x - player.x, item.y - player.y) < item.radius + player.radius) {
      if (item.type === 'SHIELD') {
        player.shield = 3;
        playSound('pickup');
        floatingTexts.push({ x: player.x, y: player.y - 40, text: '🛡️護盾啟動(3次)', life: 50, color: '#00aaff' });
        items.splice(i, 1);
      } else if (addToBackpack(item.type)) {
        playSound('pickup');
        floatingTexts.push({ x: player.x, y: player.y - 40, text: ITEM_TYPES[item.type].icon + ' ' + ITEM_TYPES[item.type].name, life: 50, color: ITEM_TYPES[item.type].color });
        items.splice(i, 1);
      }
    }
  }

  // 粒子與文字更新
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].x += particles[i].vx;
    particles[i].y += particles[i].vy;
    particles[i].life--;
    if (particles[i].life <= 0) particles.splice(i, 1);
  }
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    floatingTexts[i].y -= 0.5;
    floatingTexts[i].life--;
    if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
  }
}

// ========== 繪製 ==========
function draw() {
  ctx.fillStyle = game.slowTime > 0 ? '#050518' : '#0a0a15';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 背景網格
  ctx.strokeStyle = game.slowTime > 0 ? 'rgba(187,85,255,0.15)' : 'rgba(0,255,136,0.05)';
  ctx.lineWidth = 1;
  for (let x = 0; x < canvas.width; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  // 道具
  for (const item of items) {
    const it = ITEM_TYPES[item.type];
    ctx.save();
    ctx.translate(item.x, item.y);
    ctx.fillStyle = it.color;
    ctx.globalAlpha = 0.2 + Math.sin(game.time * 0.1) * 0.1;
    ctx.beginPath(); ctx.arc(0, 0, item.radius + 5, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(0, 0, item.radius, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(it.icon, 0, 1);
    ctx.restore();
  }

  // 浮游砲台繪製
  if (player.droneTime > 0) {
    const dx = player.x + Math.cos(player.droneAngle) * 40;
    const dy = player.y + Math.sin(player.droneAngle) * 40;
    ctx.fillStyle = '#00ffaa';
    ctx.beginPath(); ctx.arc(dx, dy, 6, 0, Math.PI * 2); ctx.fill();
  }

  // 玩家與護盾
  if (player.shield > 0) {
    ctx.strokeStyle = `rgba(0,170,255,${0.5 + Math.sin(game.time * 0.15) * 0.3})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(player.x, player.y, player.radius + 10, 0, Math.PI * 2); ctx.stroke();
  }

  ctx.save();
  ctx.translate(player.x, player.y);
  if (player.invincible > 0 && Math.floor(player.invincible / 4) % 2 === 0) ctx.globalAlpha = 0.4;
  ctx.fillStyle = player.speedTime > 0 ? '#33ffff' : '#00ff88';
  ctx.shadowColor = ctx.fillStyle;
  ctx.shadowBlur = 15;
  ctx.beginPath(); ctx.arc(0, 0, player.radius, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // 子彈
  for (const b of bullets) {
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill();
  }

  // 粒子與文字
  for (const p of particles) {
    ctx.globalAlpha = p.life / 50;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const ft of floatingTexts) {
    ctx.globalAlpha = Math.min(1, ft.life / 20);
    ctx.fillStyle = ft.color;
    ctx.font = 'bold 15px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y);
  }
  ctx.globalAlpha = 1;

  // UI - 血量條
  const barW = 200, barH = 18, barX = canvas.width / 2 - barW / 2, barY = 12;
  ctx.fillStyle = 'rgba(255,0,68,0.2)';
  ctx.fillRect(barX, barY, barW, barH);
  ctx.fillStyle = player.hp > 30 ? '#00ff88' : '#ff0044';
  ctx.fillRect(barX, barY, barW * (player.hp / player.maxHp), barH);
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.strokeRect(barX, barY, barW, barH);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('HP ' + player.hp + '/' + player.maxHp, canvas.width / 2, barY + 13);

  // UI - 分數與狀態提示
  ctx.fillStyle = '#00ff88';
  ctx.font = '14px monospace';
  ctx.textAlign = 'right';
  ctx.fillText('分數: ' + game.score, canvas.width - 12, 24);

  // UI - 背包
  const bpX = 12, bpY = canvas.height - 110;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(bpX - 4, bpY - 4, 168, 108);
  ctx.strokeStyle = 'rgba(0,255,136,0.3)';
  ctx.strokeRect(bpX - 4, bpY - 4, 168, 108);
  ctx.fillStyle = '#00ff88';
  ctx.font = '11px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('背包 (點擊或觸控使用)', bpX, bpY + 10);

  for (let i = 0; i < 20; i++) {
    const ix = bpX + (i % 5) * 32;
